# quantlang — experiment configuration
# ===========================================================================
# THE RULE: no number in this repo is invented.
#
# Every field set to `null` below is NOT YET KNOWN. Loader code MUST raise on
# reading a null — see quantlang/config.py::require(). Do not fill one in by
# hand from memory, and never substitute a plausible-looking default. Nulls are
# resolved only by the pinning scripts, which read the value from the source of
# truth and write it back.
# ===========================================================================

benchmark:
  name: belebele
  hf_dataset: facebook/belebele
  hf_revision: "7899cdfa4e1e0d733fd77c848e2c273cb1d32be2"   # pinned by scripts/pin_revisions.py
  split: test
  # Frozen 2026-08-28. The brief named eng/ben/sin/asm; npi_Deva is carried in
  # addition, not as a substitute, because CohereForAI/aya_dataset covers
  # ben/sin/eng/nep but NOT asm. Without npi, one of the four languages could
  # never enter the fine-tuning experiment at all. Cost is +1 language on P0.
  languages: [eng_Latn, ben_Beng, sin_Sinh, asm_Beng, npi_Deva]
  reference_language: eng_Latn

  # BELEBELE ships 900 items per language. Asserted at load time. If a language
  # yields any other count the run CRASHES; it is never padded or resampled.
  n_items_per_lang: 900

  # item_id key. The project brief assumed bare `question_number`, but that
  # field may not be unique within a language (each FLORES passage carries
  # several questions). scripts/verify_item_ids.py determines the true key
  # empirically and writes configs/item_id_manifest.json. Until it has run,
  # this is unknown and every downstream script must refuse to proceed.
  # RE-VERIFIED 2026-08-28 across all 5 languages after asm_Beng was added.
  # VERIFIED 2026-08-26 by scripts/verify_item_ids.py. `question_number` alone
  # takes only 2 distinct values across 900 items and is NOT a key; the brief
  # was wrong on this point. Composite key confirmed unique per language and
  # identical across all 4. Row order differs between languages, so every join
  # keys on item_id explicitly and never on position.
  item_id_key: "link#question_number"

models:
  # Frozen 2026-08-28. Qwen2.5-7B was previously pinned here and is REJECTED:
  # 7B in FP16 is ~15.2 GB against a 15.36 GB T4, so FP16 would have to shard
  # across 2 GPUs while NF4 (~4.5 GB) runs on one. Comparing latency across
  # different device topologies is exactly what the brief's timing protocol
  # forbids. 3B is ~6.2 GB: all three precisions fit one T4.
  - alias: qwen2.5-3b-instruct
    hf_id: Qwen/Qwen2.5-3B-Instruct
    revision: "aa8e72537993ba99e69dfaafa59ed015b17504d1"   # commit SHA, pinned by scripts/pin_revisions.py
    role: primary
  # A second model is deliberately NOT listed. It stays out of scope until
  # model 1's grid is complete. Adding it is a scope decision made in the open,
  # not a quiet config edit.

precisions: [fp16, int8_llmint8, nf4]

scoring:
  # letter_logit  : argmax over the 4 option-letter tokens at the answer
  #                 position. 1 forward pass/item. No parse failures.
  # option_loglik : length-normalised logprob of each full answer string.
  #                 4 forward passes/item (~4x GPU cost).
  # The active value is recorded verbatim in every run manifest, so results
  # can never be silently compared across a change of method.
  method: letter_logit
  option_letters: [A, B, C, D]

  # FROZEN 2026-08-28, before any full-scale result was produced. One template
  # for every language, every precision, every model. It is never tuned per
  # condition and never adjusted after seeing accuracy.
  prompt_template: |
    {passage}
    Question: {question}
    A. {a1}
    B. {a2}
    C. {a3}
    D. {a4}
    Answer:

  # The template ends with "Answer:" and no trailing space, so the letter the
  # model would actually emit next is " A", not "A". Scoring bare "A" would
  # read logits for a token the model was never about to produce. The loader
  # asserts each prefixed letter is exactly one token and crashes otherwise.
  option_prefix: " "

  # Passages are long and Sinhala/Assamese tokenise 3-6x English. Truncation is
  # left-side so the question and the four options are never cut off.
  max_input_tokens: 4096
  truncation_side: left

stats:
  bootstrap_iterations: 10000
  bootstrap_percentiles: [2.5, 97.5]
  seed: 20260826
  multiple_comparison_correction: holm

# ===========================================================================
# P1 -- language-specific fine-tuning x quantization.  ADDITIVE ONLY.
#
# Nothing above this line may be edited by P1 work. scripts/freeze_p0.py
# digests the P0 subtree (benchmark, models, precisions, scoring, stats) and
# tests/test_p1_freeze.py fails if any of it moves. Adding this new top-level
# key does not change that digest -- that is the point of the boundary.
#
# P1 reuses P0's scoring block verbatim: same prompt_template, same
# option_letters, same option_prefix, same letter_logit method. A fine-tuned
# model is scored by exactly the code that scored the base model, so the only
# thing that differs between the Base and FT arms is the weights.
# ===========================================================================
finetune:
  # Frozen 2026-08-28. multi-wiki-qa is the only dataset found that covers all
  # five languages without contaminating the evaluation set.
  #
  # SIB-200 was REJECTED. It has the same five FLORES config names and shipped
  # train/val/test splits, which makes it the obvious choice, but it is built
  # from FLORES-200 sentences and so is BELEBELE: 600 of its 701 English
  # training sentences (85.6%) appear VERBATIM inside BELEBELE evaluation
  # passages, touching 305 of the 488 unique passages. Fine-tuning on it means
  # training on the text of the eval set.
  #
  # multi-wiki-qa was checked the same way: 0 of 33,657 English context
  # sentences appear in any BELEBELE passage, and 0 BELEBELE passages appear in
  # any sampled context. Source is Wikipedia; BELEBELE/FLORES draw from
  # Wikinews, Wikijunior, Wikivoyage and Wikibooks.
  train_dataset: alexandrainst/multi-wiki-qa
  hf_revision: "9bdb3350487e399bd1cd873e1395290d636db5ce"   # verified on the Hub
  split: train
  license: cc-by-nc-sa-4.0   # non-commercial; fine for the paper, constrains adapter release

  # BELEBELE language code -> multi-wiki-qa config name. Keys must match
  # benchmark.languages exactly; config.py enforces that.
  lang_configs:
    eng_Latn: en
    ben_Beng: bn
    sin_Sinh: si
    npi_Deva: ne
    asm_Beng: as

  # ---- the 80/20 split -----------------------------------------------------
  # GROUPED BY ARTICLE, never by row. multi-wiki-qa carries several questions
  # per Wikipedia article over one shared `context`. Measured on 1,000 English
  # rows: 122 articles, mean 8.2 questions each, and EVERY article had more
  # than one question. A row-level random split would leak the context between
  # train and held-out for essentially every article -- the same class of bug
  # as keying BELEBELE on `question_number` alone.
  group_key: title
  train_fraction: 0.8
  item_id_separator: "#"

  # Frozen once. Both training seeds below share this split and these MCQ
  # items, so the seed-sensitivity probe varies ONLY the training run and never
  # the data it sees.
  split_seed: 20260828

  # ---- MCQ construction ----------------------------------------------------
  # multi-wiki-qa ships extractive answer spans. P1 turns each into a 4-option
  # item rendered through P0's frozen prompt_template, and the training loss
  # covers the answer-letter token only. Training therefore teaches exactly the
  # behaviour letter_logit scores, which is what keeps fine-tuned accuracy away
  # from the 0.25 chance floor where a quantization contrast stops being
  # measurable.
  n_options: 4

  # ---- final scope ---------------------------------------------------------
  # Frozen 2026-08-29. The P1 grid is reduced to English + Bangla, on time and
  # GPU grounds. The other three stay in benchmark.languages because P0 ran all
  # five and those results stand unchanged; P0 reads
  # configs/item_id_manifest.json and never touches the P1 split manifest, so
  # narrowing the P1 corpus cannot reach it.
  #
  # The reduction is independently corroborated by construction. Under
  # algorithm_version 2 an item needs three same-article answers close enough to
  # the gold to share one window, and Sinhala cannot supply them: 23.5% of its
  # rows are unbuildable at max_seq_tokens=2048, against 0.7% (English) and 6.9%
  # (Bangla). A 23.5% drop rate makes the surviving Sinhala items a
  # differently-selected sample, which is a confound rather than a cost.
  # MEASURED 2026-08-29, when a four-language grid was reconsidered. Nepali and
  # Sinhala were both built and both refused by
  # p1data.MAX_CONSTRUCTION_DROP_FRACTION (0.08):
  #
  #     eng_Latn  0.6%   3944 train items
  #     ben_Beng  5.4%   3732 train items
  #     npi_Deva  9.2%   459/5005 rows unbuildable   -> over the 8% ceiling
  #     sin_Sinh 23.5%  1173/5000 rows unbuildable   -> far over it
  #
  # Nepali misses by 1.2 points and would pass the 10% cross-language SPREAD
  # gate, so it is a judgement call rather than a hard exclusion. It was still
  # declined: Nepali yields roughly 3,640 train items, below Bangla's 3,732, so
  # admitting it lowers the equalisation cap and changes the English and Bangla
  # training partitions -- invalidating P1 sessions B and C, which are complete.
  # The cost is a rerun of all three arms for a third null. Sinhala is not a
  # judgement call: at 23.5% the surviving items are a differently selected
  # sample, which is the confound this gate exists to catch.
  #
  # Assamese remains unmeasured; it was never in scope.
  final_scope_languages: [eng_Latn, ben_Beng]

  # English yields more constructible items than Bangla (see
  # `distractors.source` below), so the two training partitions are trimmed to
  # a common size before training. Without this, "English gained more from
  # fine-tuning" would be confounded with "English took more gradient steps".
  # The trim is a deterministic subsample seeded from split_seed, and the cap
  # is min(n_train_items) over final_scope_languages only, so it does not move
  # when a provenance language is rebuilt alongside them.
  equalise_train_partition: true

  # ---- MCQ construction ----------------------------------------------------
  # multi-wiki-qa ships extractive answer spans. P1 turns each into a 4-option
  # item rendered through P0's frozen prompt_template, and the training loss
  # covers the answer-letter token only. Training therefore teaches exactly the
  # behaviour letter_logit scores, which is what keeps fine-tuned accuracy away
  # from the 0.25 chance floor where a quantization contrast stops being
  # measurable.
  distractors:
    # CHANGED 2026-08-29, algorithm_version 2. This was `exclude_same_article:
    # true` with distractors drawn from topically NEAREST OTHER articles.
    #
    # That construction was INVALID and its results are excluded from the
    # paper. The gold answer was guaranteed present in the passage -- the
    # answer-centred window is built around it and asserts it survived -- while
    # a distractor from another article was present only by coincidence. The
    # item was therefore solvable by "which option appears verbatim in the
    # passage?", with no reading required: measured shortcut success ~96%
    # (English) and ~92% (Bangla), on a gold-in-passage rate of 100% in both.
    # The gap between those two numbers is itself language-dependent, so the
    # artefact sat directly on the quantity P1 exists to measure.
    #
    # Distractors now come from the item's OWN article -- they are the answers
    # to OTHER questions about the same passage -- and the window is chosen to
    # contain all four option strings. All four options are then verbatim
    # substrings of the passage, so the substring heuristic scores exactly 0.25
    # in every language and carries no signal at all.
    #
    # Same-article answers were originally excluded on the grounds that a fact
    # stated in the same context might be a second defensible answer. They are
    # answers to DIFFERENT questions, and `assert_items_wellformed` still
    # rejects any item where two options normalise equal or where more than one
    # equals the gold. The residual risk is accepted deliberately: it is far
    # smaller than a 100%-vs-0% presence asymmetry, and unlike that asymmetry it
    # is not language-correlated.
    source: same_article

    # Superseded by `source`, kept so the change is legible in the manifest
    # rather than only in this comment.
    exclude_same_article: false

    # v1 drew distractors from the 25 topically nearest OTHER articles so an
    # option was wrong on the facts rather than wrong on the category. Under
    # `source: same_article` that control is subsumed and strengthened: every
    # option is now a fact from the very same passage. Retained as a record of
    # what v1 did; it is not read by v2 selection.
    neighbour_articles: 25

    # Surface shape (digit class, word-count bucket) is a TIE-BREAK ONLY, and
    # only between candidates whose covering windows cost the same number of
    # tokens. It is never allowed to widen the window, because widening it is
    # exactly what makes construction language-dependent. The resulting
    # option_surface_homogeneity is recorded per language and audited rather
    # than assumed.
    match_surface_type: true
    length_buckets: [1, 3, 7]   # word-count upper bounds; last bucket is 8+

  # Held-out is capped so its n matches BELEBELE's 900 exactly, which makes the
  # two surfaces' Wilson intervals directly comparable. Selection is a frozen
  # deterministic subsample recorded in configs/p1_split_manifest.json.
  heldout_eval_cap: 900

  # ---- context window ------------------------------------------------------
  # CHANGED 2026-08-29, algorithm_version 2. Was `answer_centred_tokens`.
  #
  # v1 centred the window on the gold answer span and asserted the span
  # survived. That is what guaranteed gold-in-passage = 100% and handed the
  # task its lexical shortcut (see `distractors.source`). The window policy,
  # not the distractor policy, was the proximate cause.
  #
  # v2 places the window over the SPAN THAT COVERS ALL FOUR OPTIONS -- the gold
  # plus the three same-article distractors -- and then expands outward to the
  # token budget exactly as v1 did. Every option is a verbatim substring of the
  # passage, so presence carries no information about which one is correct.
  #
  # The original v1 reason for windowing at all still holds and is unchanged:
  # multi-wiki-qa contexts are whole Wikipedia articles, median 712 tokens
  # (English) to 2,558 (Bangla) against the pinned tokenizer, so relying on
  # left-truncation destroyed the evidence for most items and did so at
  # severely language-correlated rates. The budget is in TOKENS and is THE SAME
  # NUMBER FOR EVERY LANGUAGE, for the same reason as before: a fixed CHARACTER
  # window hands English roughly four times the evidence for the same compute.
  context_window:
    policy: span_covering_tokens
    algorithm_version: 2

    # Reserved for the passage, unchanged from v1. The effective budget is
    # computed per item from its own measured overhead -- never assumed -- and
    # the final prompt length is verified, not predicted.
    context_budget_tokens: 800

    # A covering span wider than context_budget_tokens may overflow it, up to
    # the per-item ceiling (max_seq_tokens - 1 - overhead). Only the tail of the
    # distribution overflows, so this costs almost nothing: measured across the
    # full corpus, total training tokens move 1.00x (English) and 1.02x (Bangla)
    # against v1 at the same budget. An item whose covering span will not fit
    # even then is DROPPED and counted -- never clipped, because clipping it
    # would silently restore the very presence asymmetry v2 exists to remove.
    allow_overflow_to_cover_options: true

    # Windows are moved outward to whitespace so the passage does not begin or
    # end mid-word. The trim may never cut into any of the four option spans.
    trim_to_whitespace: true

  # ---- training ------------------------------------------------------------
  # FP16 base -> LoRA -> merge -> quantize. Never LoRA on a quantized base:
  # that produces a mixed-precision object whose quantization effect is a
  # different estimand from P0's.
  train_precision: fp16
  seeds:
    main: 20260828
    sensitivity: 20260829
    # Second seed runs for these two only -- the accuracy extremes. This is a
    # sensitivity probe, not an additional experimental cell.
    sensitivity_languages: [eng_Latn, sin_Sinh]

  lora:
    r: 16
    alpha: 32
    dropout: 0.05
    target_modules: [q_proj, k_proj, v_proj, o_proj, gate_proj, up_proj, down_proj]

  training:
    epochs: 1
    learning_rate: 0.0002
    lr_scheduler: cosine
    warmup_ratio: 0.03
    per_device_train_batch_size: 1
    gradient_accumulation_steps: 8
    gradient_checkpointing: true
    optim: adamw_torch
    max_grad_norm: 1.0
    # RAISED 2026-08-29 from 1024, before any v2 result was produced. Still
    # tighter than scoring.max_input_tokens (4096). Truncation side is taken
    # from scoring.truncation_side (left), so the question and the four options
    # are never cut off -- the same guarantee P0 evaluation relies on.
    #
    # 1024 was chosen for v1, where the window never needed to reach past the
    # gold span. Under v2 the window must cover four option spans, and 1024
    # makes that LANGUAGE-DEPENDENT: measured across the full corpus, 97.9% of
    # English rows are constructible against 74.8% of Bangla, a 23.1pp gap of
    # exactly the kind this design refuses to ship. Measured feasibility by
    # ceiling, English / Bangla:
    #     1024 -> 97.9% / 74.8%   (23.1pp)
    #     2048 -> 99.3% / 93.5%   ( 5.8pp)
    #     2560 -> 99.5% / 95.5%   ( 4.0pp)
    #     4096 -> 99.8% / 98.1%   ( 1.7pp)
    # 2048 is taken because the cost is ~nil (1.00x English, 1.02x Bangla total
    # training tokens: batch size is 1 and nothing is padded, so only the
    # overflowing tail gets longer) and because it is the smallest ceiling at
    # which Bangla still yields more than heldout_eval_cap held-out items --
    # at 1024 Bangla yields 722, below the 900 cap, and held-out parity with
    # BELEBELE breaks outright.
    max_seq_tokens: 2048
